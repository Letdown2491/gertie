# Orchard (https://github.com/Letdown2491/orchard) listing for the Flatpak.
#
# Read by `orchard-publish`. The CI release workflow (.github/workflows/
# release.yml) runs it on tags: one prepare per architecture, then a
# single signing run with both prepared assets. Local preparation is
# safe (no key, no network):
#   orchard-publish self/gertie.publish.toml --prepare
# ORCHARD_PUBLISH_VERSION (set from the tag) overrides [release] version.

[app]
id = "io.github.Letdown2491.gertie"
name = "Gertie"
summary = "A fast, native coding-agent harness"
description = """\
A coding agent with a GPU-rendered UI and a headless core: long-term
memory with a review inbox, worktree tabs, subagents, skills, MCP, and
permission modes that keep every mutating action behind a card you
approve. The flatpak runs commands through your host environment, so
your toolchains (rust, node, go, python) work as they do outside the
sandbox; every action is gated by the permission mode you choose, and
full access costs a confirmation card."""
categories = ["Development"]
license = "MIT"
repository = "https://github.com/Letdown2491/gertie"
homepage = "https://github.com/Letdown2491/gertie"
# Must be a PNG: Orchard caches icons without extensions, and an SVG then
# fails to render. Absolute URL: the store fetches it over HTTP, it cannot
# read the publisher's disk.
icon = "https://raw.githubusercontent.com/Letdown2491/gertie/main/assets/gertie-512.png"

[release]
# Placeholder. The workflow sets ORCHARD_PUBLISH_VERSION from the tag.
version = "1.0.1"
channel = "stable"
arch = "linux-x86_64"
# The listing declares coverage for both arches; the CI prepare legs
# pass --arch for their own build, and the single signing run publishes
# one listing with both prepared assets.
platforms = ["linux-x86_64", "linux-aarch64"]
notes = "The first flatpak: the same binary the release page carries, packaged for the desktop."

[artifact]
tree = "tree"

[publish]
# relay.orchard.rocks is required (see PUBLISHING.md): orchard-publish
# refuses a manifest publish without it.
relays = ["wss://relay.orchard.rocks", "wss://relay.primal.net", "wss://nos.lol"]
tag = "latest"
