[package]
name = "gertie-core"
description = "gertie's headless agent core: loop, sessions, permissions, checkpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-stream = "0.3"
base64 = "0.22"
futures-core = { version = "0.3", features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Evidence hashes are git blob ids (`git hash-object`), so a cited
# file state can be looked up with `git log --find-object`.
sha1_smol = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
