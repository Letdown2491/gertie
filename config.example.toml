# gertie config — copy to ~/.config/gertie/config.toml and edit.
# Keys are read from the environment (preferred) or the `api_key` field.
# IMPORTANT: `[[endpoints]]` is a TOML table header — uncomment it too,
# not just the fields under it.

[[endpoints]]
name = "ppq"
base_url = "https://api.ppq.ai/v1"
model = "glm-5.3-flash"
api_key_env = "PPQ_API_KEY"

# A local model needs no key:
# [[endpoints]]
# name = "ollama"
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3-coder"

default_endpoint = "ppq"
