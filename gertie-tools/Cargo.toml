[package]
name = "gertie-tools"
description = "gertie's built-in tools and MCP client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gertie-core = { workspace = true }
futures-core = { version = "0.3", features = ["alloc"] }
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The oneshot bridging a tool's OS thread back into the async loop.
tokio = { version = "1", features = ["sync"] }
walkdir = "2"
# The repo map (#41): top-level symbols per file, parsed, not grepped.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
# Kernel-level filesystem sandbox for bash children (opt-in).
landlock = "0.4"
# O_NOFOLLOW for the write tools (the raced-symlink guard).
libc = "0.2"
# Images a tool hands the model (#50): decode, scale, re-encode. The
# version gpui already builds, so no second copy.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
# Same reqwest fork the provider uses: one TLS stack in the binary.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[dev-dependencies]
tempfile = "3"
