[package]
name = "gertie-providers"
description = "Provider trait and implementations for gertie (OpenAI-compatible first)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gertie-core = { workspace = true }
bytes = "1"
futures-core = { version = "0.3", features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# gpui-kit's HTTP client is built on this reqwest fork; sharing it keeps one
# build across the workspace. UI-free by itself — this is just reqwest.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Replay scenarios are TOML files — same format as everything else the
# user touches.
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
# Scenario-file tests need a throwaway directory on disk.
tempfile = "3"
