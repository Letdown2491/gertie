# The showcase scenario: prose, a real tool call, and a markdown answer.
# It exists so UI work never needs a paid model — point a replay
# endpoint's model at this name and watch a full turn render.

[[steps]]
text = "I'll check what this workspace looks like first."

[[steps.tool_calls]]
name = "read_file"
arguments = '{"path": "README.md"}'

[[steps]]
text = """## What I found

The README describes a **native coding-agent harness** — GPU-rendered
UI, a headless core that is a plain library, everything local.

| Property | Value |
| --- | --- |
| Sessions | SQLite, full-text search |
| Checkpoints | before every file-mutating tool |
| Telemetry | none |

The turn you are watching is scripted: the tools really ran, only the
model is a recording."""

[[steps]]
text = "All done — zero tokens spent."
