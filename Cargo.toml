[workspace]
resolver = "3"
members = ["gertie", "gertie-core", "gertie-providers", "gertie-tools"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Letdown2491/gertie"

# deb/rpm metadata lives beside the gertie crate (Cargo.toml in gertie/):
# `cargo deb` and `cargo generate-rpm` read the binary crate's manifest.
# Both packages carry the app id as Provides/Conflicts, so a
# package-manager install and a flatpak of the same app refuse to
# coexist by convention.

[workspace.dependencies]
gertie-core = { path = "gertie-core" }
gertie-providers = { path = "gertie-providers" }
gertie-tools = { path = "gertie-tools" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = true

# The icons went blank after the gpui-kit 0.11 upgrade: gpui-pre-wgpu
# 0.3.14 (the Linux wayland renderer) declares MonochromeSprite in its
# shader with the 0.3.7 field order (pad, bounds, tile) while gpui-pre
# 0.3.14 reordered the Rust struct to (animation, tile, bounds). Same
# 112-byte stride, reordered fields: the GPU read every sprite's tile
# as bounds and vice versa, so icons painted blank inside intact
# containers (img() bypasses sprites, which is why the logo survived).
# The vendor copy reorders the declaration to match the Rust struct;
# removable when the fork ships a matching shader (watch gpui-pre-wgpu
# > 0.3.14).
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
