[workspace]
resolver = "3"
members = ["gertie", "gertie-core", "gertie-providers", "gertie-tools"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Letdown2491/gertie"

# deb/rpm metadata lives beside the gertie crate (Cargo.toml in gertie/):
# `cargo deb` and `cargo generate-rpm` read the binary crate's manifest.
# Both packages carry the app id as Provides/Conflicts, so a
# package-manager install and a flatpak of the same app refuse to
# coexist by convention.

[workspace.dependencies]
gertie-core = { path = "gertie-core" }
gertie-providers = { path = "gertie-providers" }
gertie-tools = { path = "gertie-tools" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = true
