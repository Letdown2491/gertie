[package]
name = "gertie"
description = "gertie: a fast, native agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gertie"
path = "src/main.rs"

[dependencies]
gertie-core = { workspace = true }
gertie-providers = { workspace = true }
gertie-tools = { workspace = true }
base64 = "0.22"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
toml = "0.9"
# Format-preserving TOML editing: the settings panel writes the user's
# config.toml without destroying their comments or unknown keys.
toml_edit = "0.25"

[dev-dependencies]
# The headless UI harness: window.input()/press() to drive the real
# widget tree without a display.
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"
