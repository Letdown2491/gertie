[package]
name = "gertie"
description = "gertie: a fast, native agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gertie"
path = "src/main.rs"

# deb/rpm packaging: `cargo deb` and `cargo generate-rpm` (CI-installed
# subcommands) read these blocks against the release build. Both packages
# Provide/Conflict the app id, so a package-manager install and a flatpak
# of the same app refuse to coexist by convention (the desktop file's
# comment says which one owns it). The assets land in the package with
# their paths preserved: bin into /usr/bin, the desktop file and icons
# into the hicolor/app-id locations the desktop already resolves.
[package.metadata.cargo-deb]
maintainer = "martin <github.penknife946@passmail.net>"
license-file = ["../LICENSE", "0"]
depends = "$auto"
extended-description = """\
A fast, native coding-agent harness with a GPU-rendered UI and a headless
core. Long-term memory with a review inbox, worktree tabs, subagents,
skills, MCP, and permission modes that keep every mutating action behind
a card you approve."""
section = "devel"
assets = [
    ["target/release/gertie", "usr/bin/", "755"],
    ["assets/io.github.Letdown2491.gertie.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.Letdown2491.gertie.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/gertie-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.Letdown2491.gertie.png", "644"],
]
conflicts = "io.github.Letdown2491.gertie"
provides = "io.github.Letdown2491.gertie"

[package.metadata.generate-rpm]
maintainer = "martin <github.penknife946@passmail.net>"
license = "MIT"
summary = "A fast, native coding-agent harness"
group = "Development/Tools"
post_install_script = """
if command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database >/dev/null 2>&1 || true; fi
"""
assets = [
    { source = "target/release/gertie", dest = "/usr/bin/gertie", mode = "755" },
    { source = "assets/io.github.Letdown2491.gertie.desktop", dest = "/usr/share/applications/io.github.Letdown2491.gertie.desktop", mode = "644" },
    { source = "assets/io.github.Letdown2491.gertie.metainfo.xml", dest = "/usr/share/metainfo/io.github.Letdown2491.gertie.metainfo.xml", mode = "644" },
    { source = "assets/gertie-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.Letdown2491.gertie.png", mode = "644" },
]
# (requires: none beyond glibc; gertie links the client libs only on GUI builds)

[dependencies]
gertie-core = { workspace = true }
gertie-providers = { workspace = true }
gertie-tools = { workspace = true }
base64 = "0.22"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
toml = "0.9"
# The doctor's opt-in update check: same gpui-pre-reqwest fork as the
# tools (one TLS stack in the binary), blocking because doctor is a
# one-shot command.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# Format-preserving TOML editing: the settings panel writes the user's
# config.toml without destroying their comments or unknown keys.
toml_edit = "0.25"

[dev-dependencies]
# The headless UI harness: window.input()/press() to drive the real
# widget tree without a display.
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"
