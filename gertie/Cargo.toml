[package]
name = "gertie"
description = "gertie: a fast, native agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gertie"
path = "src/main.rs"

[dependencies]
gertie-core = { workspace = true }
gertie-providers = { workspace = true }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
